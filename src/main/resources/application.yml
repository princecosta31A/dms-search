spring:
  application:
    name: dms-search
  # This service is read-only over Elasticsearch: no datasource, no Mongo,
  # no Kafka. Result lists are served from fields already held in ES; a client
  # needing the full document fetches it from document-service by id.
  threads:
    virtual:
      # Java 21 virtual threads. Search is I/O-bound — nearly all of a request
      # is spent waiting on the Elasticsearch socket — so a blocking handler on
      # a virtual thread gives reactive-like concurrency without reactive code.
      enabled: true

server:
  port: ${SEARCH_SERVER_PORT:7008}
  # No context-path. Routes are served at the root exactly as the controllers
  # map them, matching document-service.
  shutdown: graceful

# API versioning — header-based, matching document-service. The path carries no
# version segment; the version travels in X-API-Version.
api:
  versioning:
    supported-versions: ${API_SUPPORTED_VERSIONS:1.0}
    # Omitting the header resolves to this rather than returning 400 — keeps
    # curl and browser exploration frictionless while still allowing clients to pin.
    #
    # NOTE: no quotes inside the ${...} default. Writing ${API_DEFAULT_VERSION:"1.0"}
    # yields the literal string "1.0" INCLUDING the quote characters, which fails
    # SemanticApiVersionParser at startup with "Invalid API version format".
    default-version: ${API_DEFAULT_VERSION:1.0}
    header-name: ${API_VERSION_HEADER:X-API-Version}

elasticsearch:
  host: ${ES_HOST_URL:http://localhost:9200}
  # The ALIAS, never a concrete index. See ElasticsearchProperties.
  index: ${ES_INDEX:dms-documents}
  # Optional auth — leave unset for a local cluster with security disabled.
  api-key: ${ES_API_KEY:}
  username: ${ES_USER:}
  password: ${ES_PASSWORD:}
  request-timeout-ms: ${ES_REQUEST_TIMEOUT_MS:5000}
  # Must match the index's max_result_window (verified: 10000 on dms-documents).
  max-result-window: ${ES_MAX_RESULT_WINDOW:10000}
  default-page-size: 20
  max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never          # never leak dependency internals to callers
  health:
    defaults:
      enabled: true
  otlp:
    metrics:
      export:
        # Off unless an endpoint is configured. Spring's default points at
        # localhost:4318, and on a host with no collector every push blocks for
        # the socket timeout and then logs a stack trace — noise that buries real
        # errors. Set MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true where a
        # collector actually exists.
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}

logging:
  level:
    root: INFO
    com.teamsync.dmssearch: INFO
    # The ES client logs full request bodies at DEBUG. Search terms routinely
    # contain PAN/passport numbers and names, so this must never be lowered in
    # any deployed environment.
    co.elastic.clients: WARN
    org.apache.hc: WARN
